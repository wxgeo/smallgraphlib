[project]
name = "smallgraphlib"
version = "1.3.0"
description = "Simple library for handling small graphs, including Tikz code generation."
authors = [{ name = "Nicolas Pourcelot", email = "nicolas.pourcelot@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = [
    "graph",
    "tikz",
    "latex",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/wxgeo/smallgraphlib"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-pythonhashseed>=2",
    "pytest-xdist>=3.5.0,<4",
    "mypy>=2.1",
    "black>=26.5.1",
    "sphinx-autodoc-typehints>=1.18.3",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "sympy>=1.10.1,<2",
    "python-semantic-release>=10.5.3",
    "ruff>=0.9.1",
    "numpy>=1.26.4",
    "sphinx>=8",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name= "smallgraphlib"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[semantic_release.remote.token]
env = "GH_TOKEN"

[tool.mypy]
implicit_optional = true
warn_unused_ignores = true
strict_equality = true

[tool.black]
line-length = 110

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL"

[tool.ruff]
line-length = 110
fix = true

[tool.ruff.lint]
ignore = ["E203"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/test_latex_export.py" = ["E501"]



